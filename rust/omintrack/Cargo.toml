[package]
name = "omintrack"
version = "0.1.0"
edition = "2021"
description = "Rust core for OminVisionFlowSight multi-object tracker (UKF family + matching)"

[lib]
name = "omintrack"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
nalgebra = { version = "0.32", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
